  over:    { label: &quot;Piutang &amp;gt; 26 Hari&quot;,  color: &quot;var(--cat-over)&quot;,   wash: &quot;var(--cat-over-wash)&quot; },
};
const CAT_ORDER = [&quot;belum&quot;,&quot;notdue&quot;,&quot;d7&quot;,&quot;d14&quot;,&quot;d26&quot;,&quot;over&quot;];

function parseDate(s) {
  if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3]);
}

const today = new Date();
today.setHours(0,0,0,0);

function computeHari(tglJto) {
  const d = parseDate(tglJto);
  if (!d) return null;
  return Math.round((today - d) / 86400000);
}

const NO_TAGIH_MARKERS = [&quot;belum buat tagihan&quot;, &quot;-&quot;, &quot;&quot;];
function categorize(row) {
  const raw = (row.tglTagih || &quot;&quot;).toString().trim().toLowerCase();
  const hasTagih = raw !== &quot;&quot; &amp;&amp; !NO_TAGIH_MARKERS.includes(raw);
  const hari = computeHari(row.tglJto);
  if (!hasTagih) return &quot;belum&quot;;
  if (hari === null) return &quot;notdue&quot;;
  if (hari &lt; 1) return &quot;notdue&quot;;
  if (hari &lt;= 7) return &quot;d7&quot;;
  if (hari &lt;= 14) return &quot;d14&quot;;
  if (hari &lt;= 26) return &quot;d26&quot;;
  return &quot;over&quot;;
}

let rows = RAW.map(r =&gt; ({...r, hari: computeHari(r.tglJto), cat: categorize(r)}));

function sortGroup(list) {
  return list.sort((a, b) =&gt; {
    const l = (a.leasing || &quot;&quot;).localeCompare(b.leasing || &quot;&quot;);
    if (l !== 0) return l;
    return (b.hari ?? -999) - (a.hari ?? -999);
  });
}

function fmtMoney(n) { return Math.round(n).toLocaleString(&#x27;id-ID&#x27;); }
function fmtDateShort(s) {
  const d = parseDate(s);
  if (!d) return s || &quot;\u2013&quot;;
  const dd = String(d.getDate()).padStart(2, &#x27;0&#x27;);
  const mm = String(d.getMonth() + 1).padStart(2, &#x27;0&#x27;);
  return `${dd}/${mm}/${d.getFullYear()}`;
}

function groupByLeasing(list) {
  const map = new Map();
  list.forEach(r =&gt; {

    if (!map.has(key)) map.set(key, []);
    map.get(key).push(r);

  return [...map.entries()]
    .map(([leasing, items]) =&gt; ({
      leasing,
      items: sortGroup(items.slice()),
      total: items.reduce((s,r)=&gt;s+(Number(r.jumlah)||0), 0),
      bucketTotals: BUCKET_KEYS.reduce((acc,k) =&gt; {
        acc[k] = items.filter(r=&gt;r.cat===k).reduce((s,r)=&gt;s+(Number(r.jumlah)||0), 0);
        return acc;
      }, {}),
    }))
    .sort((a,b) =&gt; b.total - a.total);
}

function sortVal(r, key) {
  switch (key) {
    case &#x27;no&#x27;: return 0;
    case &#x27;jumlah&#x27;: return Number(r.jumlah) || 0;
    case &#x27;hari&#x27;: return r.hari ?? -9999;
    case &#x27;tglJto&#x27;: case &#x27;tglTagih&#x27;: case &#x27;tglBarcode&#x27;: {
      const d = parseDate(r[key]);
      return d ? d.getTime() : -Infinity;
    }
    default: return (r[key] || &quot;&quot;).toString().toLowerCase();
  }
}

      th.appendChild(span);

function detectDelimiter(text) {
  const lines = text.split(/\r?\n/).filter(l =&gt; l.trim().length &gt; 0).slice(0, 15);

}

}
// Deteksi DMY / MDY dari data itu sendiri (angka &gt; 12 pasti hari)
function detectDateFormat(list) {

}
function csvIso(s, fmt) {

}

    if ((cellStr(row[0]) === &#x27;No&#x27; &amp;&amp; cellStr(row[1]) === &#x27;No.Cust&#x27;) || cellStr(row[2]).toLowerCase() === &#x27;nama debitur&#x27;) { h = i; break; }

  const body = csv.slice(h + 1).filter(r =&gt; r &amp;&amp; cellStr(r[2]) &amp;&amp; ![&#x27;total:&#x27;, &#x27;nama debitur&#x27;].includes(cellStr(r[2]).toLowerCase()) &amp;&amp; cellNum(r[6]));

  const nm = v =&gt; { v = cellStr(v); return v.includes(&#x27;=&#x27;) ? v.slice(v.indexOf(&#x27;=&#x27;) + 1).trim() : v; };

  const list = body.filter(r =&gt; cellStr(r[9]) === TARGET_DIVISI).map(r =&gt; {

    var all = rowsOf(active).filter(supMatch), n60 = 0, n90 = 0, n91 = 0, nStnk = 0;
    all.forEach(function (r) {
      if (r.b === &quot;lt60&quot;) n60++; else if (r.b === &quot;gt60&quot;) n90++; else if (r.b === &quot;gt90&quot;) n91++;
      if (r.blank) nStnk++;
    });
    el(&quot;bigLabel&quot;).textContent = &quot;Total BPKB Cash belum diserahkan \u2014 &quot; + active + (curSup() ? &quot; \u00b7 &quot; + curSup() : &quot;&quot;);
    el(&quot;bigVal&quot;).textContent = nf.format(all.length);
    el(&quot;bigSub&quot;).innerHTML = &quot;dari &lt;b&gt;&quot; + nf.format(all.length) + &quot;&lt;/b&gt; unit &amp;middot; hanya Leasing Cash&quot;;
    if (active === ALL &amp;&amp; !curSup()) {
      el(&quot;bigSub&quot;).innerHTML += &quot;&lt;br&gt;&quot; + DIVISIONS.map(function (d) { return esc(d) + &quot; &lt;b&gt;&quot; + nf.format(data[d].length) + &quot;&lt;/b&gt;&quot;; }).join(&quot; &amp;middot; &quot;);
    }
    el(&quot;c60&quot;).textContent = nf.format(n60);
    el(&quot;c90&quot;).textContent = nf.format(n90);
    el(&quot;c91&quot;).textContent = nf.format(n91);
    el(&quot;cStnk&quot;).textContent = nf.format(nStnk);

    var list = filtered();
    el(&quot;tbody&quot;).innerHTML = list.map(function (r, i) {
      var c = r.c;
      return &quot;&lt;tr&gt;&lt;td class=&#x27;r&#x27;&gt;&quot; + (i + 1) + &quot;&lt;/td&gt;&lt;td class=&#x27;clip&#x27; title=\&quot;&quot; + esc(c[0]) + &quot;\&quot;&gt;&quot; + esc(c[0]) + &quot;&lt;/td&gt;&lt;td class=&#x27;clip&#x27; title=\&quot;&quot; + esc(c[1]) + &quot;\&quot;&gt;&quot; + esc(c[1]) +
        &quot;&lt;/td&gt;&lt;td&gt;&quot; + esc(r.bpkb || &quot;-&quot;) + &quot;&lt;/td&gt;&lt;td&gt;&quot; + esc(r.terima || &quot;-&quot;) + &quot;&lt;/td&gt;&lt;td&gt;&quot; + esc(r.ambil || &quot;&quot;) + &quot;&lt;/td&gt;&lt;td&gt;&quot; + esc(c[3]) +
        &quot;&lt;/td&gt;&lt;td&gt;&quot; + esc(c[4]) + &quot;&lt;/td&gt;&lt;td class=&#x27;clip&#x27; title=\&quot;&quot; + esc(c[5]) + &quot;\&quot;&gt;&quot; + esc(c[5]) + &quot;&lt;/td&gt;&lt;td&gt;&quot; + esc(c[6]) + &quot;&lt;/td&gt;&lt;td&gt;&quot; + esc(r.div) +
        &quot;&lt;/td&gt;&lt;td class=&#x27;num&#x27;&gt;&quot; + (r.days == null ? &quot;-&quot; : nf.format(r.days)) + &quot;&lt;/td&gt;&lt;td&gt;&quot; + esc(c[2]) + &quot;&lt;/td&gt;&lt;/tr&gt;&quot;;
    }).join(&quot;&quot;);

    Array.prototype.forEach.call(document.querySelectorAll(&quot;.card[data-filter]&quot;), function (c) {
      var on = cardFilter !== &quot;&quot; &amp;&amp; c.dataset.filter === cardFilter;
      c.classList.toggle(&quot;active&quot;, on);
      c.setAttribute(&quot;aria-pressed&quot;, on ? &quot;true&quot; : &quot;false&quot;);
    });
    var chip = el(&quot;chip&quot;);
    if (view !== &quot;sup&quot; &amp;&amp; cardFilter) {
      var parts = [];
      if (view === &quot;supdetail&quot;) parts.push(&quot;Supervisor &quot; + supFilter);
      parts.push(FILTER_NAMES[cardFilter]);
      chip.hidden = false;
      chip.innerHTML = &quot;Menampilkan: &lt;b&gt;&quot; + esc(parts.join(&quot; \u00b7 &quot;)) + &quot;&lt;/b&gt; &amp;middot; &quot; + nf.format(list.length) +
        &#x27; unit di &#x27; + esc(active) + &#x27; &lt;button type=&quot;button&quot; class=&quot;btn plain&quot; id=&quot;chipClear&quot;&gt;Hapus filter&lt;/button&gt;&#x27;;
      el(&quot;chipClear&quot;).onclick = function () { cardFilter = &quot;&quot;; renderAll(); };
    } else { chip.hidden = true; chip.innerHTML = &quot;&quot;; }

    var empty = el(&quot;empty&quot;);
    empty.hidden = list.length &gt; 0;
    empty.textContent = loaded ? &quot;Tidak ada data yang cocok dengan pencarian.&quot; : &quot;Mengambil data dari Google Sheets...&quot;;
    el(&quot;count&quot;).textContent = list.length === all.length
      ? nf.format(all.length) + &quot; baris&quot;
      : nf.format(list.length) + &quot; dari &quot; + nf.format(all.length) + &quot; baris&quot;;
    if (view === &quot;sup&quot;) renderSup();
  }

  /* ---------- aksi ---------- */
  function pickCard(f) {
    if (view === &quot;sup&quot; &amp;&amp; f !== &quot;&quot;) view = &quot;detail&quot;;
    cardFilter = (f === &quot;&quot; || f === cardFilter) ? &quot;&quot; : f;
    renderAll();
    if (cardFilter) el(&quot;chip&quot;).scrollIntoView({ behavior: &quot;smooth&quot;, block: &quot;start&quot; });
  }
  Array.prototype.forEach.call(document.querySelectorAll(&quot;.card[data-filter]&quot;), function (c) {
    c.addEventListener(&quot;click&quot;, function () { pickCard(c.dataset.filter); });
    c.addEventListener(&quot;keydown&quot;, function (e) {
      if (e.key === &quot;Enter&quot; || e.key === &quot; &quot;) { e.preventDefault(); pickCard(c.dataset.filter); }
    });
  });

  el(&quot;btnRefresh&quot;).addEventListener(&quot;click&quot;, refreshNow);
  el(&quot;q&quot;).addEventListener(&quot;input&quot;, renderAll);

  /* ---------- export (tab yang sedang dibuka, sesuai pencarian dan urutan) ---------- */
  var HEAD = [&quot;No&quot;,&quot;Customer Nama&quot;,&quot;STNK a/n&quot;,&quot;Nomor BPKB&quot;,&quot;Terima Tanggal&quot;,&quot;Serah Tanggal&quot;,&quot;No Polisi&quot;,&quot;Leasing&quot;,&quot;Salesman&quot;,&quot;Supervisor&quot;,&quot;Divisi&quot;,&quot;Umur (hari)&quot;,&quot;No Rangka&quot;];
  var SUPHEAD = [&quot;No&quot;,&quot;Supervisor&quot;,&quot;Total Unit&quot;,&quot;&lt; 60 hari&quot;,&quot;&gt; 60 hari&quot;,&quot;&gt; 90 hari&quot;,&quot;STNK belum diserahkan&quot;];
  var dlCap = null;
  if (window.claude &amp;&amp; typeof claude.use === &quot;function&quot;) {
    claude.use(&quot;downloads&quot;).then(function (d) { dlCap = d; }, function () { });
  }

  // Yang diexport mengikuti tampilan: Detail = daftar unit, Per Supervisor = rekap
  function exportSpec() {
    if (view === &quot;sup&quot;) {
      var list = supList(), tot = [0, 0, 0, 0, 0];
      var rows = list.map(function (g, i) {
        tot[0] += g.total; tot[1] += g.lt60; tot[2] += g.gt60; tot[3] += g.gt90; tot[4] += g.stnk;
        return [i + 1, g.name, g.total, g.lt60, g.gt60, g.gt90, g.stnk];
      });
      if (rows.length) rows.push([&quot;&quot;, &quot;Total &quot; + active].concat(tot));
      return { head: SUPHEAD, rows: rows, title: &quot;Rekap BPKB Cash per Supervisor - &quot; + active, prefix: &quot;bpkb-cash-supervisor-&quot;, numeric: true };
    }
    return {
      head: HEAD, title: &quot;BPKB Belum Diserahkan (Cash) - &quot; + active + (curSup() ? &quot; - Supervisor &quot; + curSup() : &quot;&quot;), prefix: curSup() ? &quot;bpkb-cash-&quot; + curSup().toLowerCase().replace(/\s+/g, &quot;-&quot;) + &quot;-&quot; : &quot;bpkb-cash-&quot;,
      rows: filtered().map(function (r, i) { return [i + 1, r.c[0], r.c[1], r.bpkb || &quot;&quot;, r.terima || &quot;&quot;, r.ambil || &quot;&quot;, r.c[3], r.c[4], r.c[5], r.c[6], r.div, r.days == null ? &quot;&quot; : r.days, r.c[2]]; })
    };
  }
  function fileBase(prefix) {
    var d = new Date();
    return prefix + active.toLowerCase().replace(/\s+/g, &quot;-&quot;) + &quot;-&quot; +
      d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + &quot;-&quot; + pad(d.getHours()) + pad(d.getMinutes());
  }
  function saveFile(name, data, mime) {
    if (dlCap) {
      return dlCap.save({ filename: name, data: data }).catch(function (e) {
        if (e &amp;&amp; e.code === &quot;declined&quot;) return;
        toast(&quot;File tidak bisa disimpan dari halaman ini (&quot; + ((e &amp;&amp; e.code) || &quot;gagal&quot;) + &quot;).&quot;);
      });
    }
    var a = document.createElement(&quot;a&quot;);
    a.href = URL.createObjectURL(new Blob([data], { type: mime }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    return Promise.resolve();
  }

  el(&quot;btnExcel&quot;).addEventListener(&quot;click&quot;, function () {
    var sp = exportSpec();
    if (!sp.rows.length) { toast(&quot;Tidak ada data untuk diexport.&quot;); return; }
    if (!window.XLSX) { toast(&quot;Pustaka Excel belum termuat. Periksa koneksi internet lalu coba lagi.&quot;); return; }
    var ws = XLSX.utils.aoa_to_sheet([sp.head].concat(sp.rows));
    ws[&quot;!cols&quot;] = sp.numeric
      ? [{ wch: 5 }, { wch: 30 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 22 }]
      : [{ wch: 5 }, { wch: 32 }, { wch: 32 }, { wch: 18 }, { wch: 14 }, { wch: 16 }, { wch: 14 }, { wch: 8 }, { wch: 28 }, { wch: 18 }, { wch: 14 }, { wch: 12 }, { wch: 20 }];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, active);
    var buf = XLSX.write(wb, { bookType: &quot;xlsx&quot;, type: &quot;array&quot; });
    saveFile(fileBase(sp.prefix) + &quot;.xlsx&quot;, buf, &quot;application/vnd.openxmlformats-officedocument.spreadsheetml.sheet&quot;);
  });

  el(&quot;btnPdf&quot;).addEventListener(&quot;click&quot;, function () {
    var J = window.jspdf &amp;&amp; window.jspdf.jsPDF, sp = exportSpec();
    if (!sp.rows.length) { toast(&quot;Tidak ada data untuk diexport.&quot;); return; }
    if (!J) { window.print(); return; }
    var doc = new J({ orientation: &quot;landscape&quot;, unit: &quot;pt&quot;, format: &quot;a4&quot; });
    if (typeof doc.autoTable !== &quot;function&quot;) { window.print(); return; }
    doc.setFontSize(14);
    doc.text(sp.title, 40, 36);
    doc.setFontSize(9);
    doc.text(&quot;PT Perintis Perkasa, Medan  |  &quot; + (perFor(active) || stamp(Date.now())) + &quot;  |  &quot; + (sp.numeric ? sp.rows.length - 1 + &quot; supervisor&quot; : sp.rows.length + &quot; unit&quot;), 40, 52);
    var cs = { 0: { halign: &quot;right&quot;, cellWidth: 28 } };
    if (sp.numeric) { [2, 3, 4, 5, 6].forEach(function (i) { cs[i] = { halign: &quot;right&quot; }; }); }
    doc.autoTable({
      head: [sp.head], body: sp.rows, startY: 64, margin: { left: 40, right: 40 },
      styles: { fontSize: 8, cellPadding: 3, overflow: &quot;linebreak&quot; },
      headStyles: { fillColor: [31, 41, 55] }, columnStyles: cs
    });
    saveFile(fileBase(sp.prefix) + &quot;.pdf&quot;, doc.output(&quot;arraybuffer&quot;), &quot;application/pdf&quot;);
  });

  document.addEventListener(&quot;visibilitychange&quot;, function () {
    if (document.hidden || !directOn) return;
    if (Date.now() - lastRead &gt; REFRESH_MS) directOnce();
  });

  buildViews();
  buildTabs();
  buildHead();
  buildSupHead();
  renderAll();
  setLive(&quot;off busy&quot;, &quot;Menghubungkan ke Google Sheet&quot;, &quot;Mengambil data dari Google Sheets...&quot;);
  startLive();
})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe></div>
</div>

<script>
(function () {
  // Password wajib setiap kali halaman dibuka / di-reload (tidak ada sesi yang disimpan). Sekali login berlaku untuk kedua tab.
  var PASSWORD = 'perintisgatsu2026';
  var gate = document.getElementById('passwordGate'), form = document.getElementById('pwForm');
  var input = document.getElementById('pwInput'), err = document.getElementById('pwError'), eye = document.getElementById('pwEye');
  var ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>', ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
  var tabs = document.querySelectorAll('.tab'), unlocked = false, current = 'piutang';

  function setEye(show) {
    input.type = show ? 'text' : 'password';
    eye.innerHTML = show ? ICON_OFF : ICON_ON;
    var t = show ? 'Sembunyikan password' : 'Tampilkan password';
    eye.setAttribute('aria-label', t); eye.title = t;
  }
  setEye(false);
  eye.addEventListener('click', function () { setEye(input.type === 'password'); input.focus(); });
  try { sessionStorage.removeItem('pp_auth_gatsu'); } catch (e) {}

  // Abaikan spasi dan huruf besar/kecil (keyboard HP sering menambahkannya otomatis)
  function norm(v) { return String(v).replace(/\s+/g, '').toLowerCase(); }

  function load(name) {
    var f = document.getElementById('f-' + name);
    if (f && f.hasAttribute('data-srcdoc')) { f.setAttribute('srcdoc', f.getAttribute('data-srcdoc')); f.removeAttribute('data-srcdoc'); }
  }
  function show(name) {
    current = name;
    tabs.forEach(function (t) { t.setAttribute('aria-selected', String(t.dataset.tab === name)); });
    document.querySelectorAll('.panel').forEach(function (p) { p.classList.toggle('active', p.id === 'p-' + name); });
    if (unlocked) load(name);   // dashboard baru dimuat setelah login berhasil
    try { history.replaceState(null, '', '#' + name); } catch (e) {}
  }
  tabs.forEach(function (t) { t.addEventListener('click', function () { show(t.dataset.tab); }); });

  function unlock() { unlocked = true; gate.classList.add('hidden'); document.body.classList.remove('locked'); load(current); }
  function lock() {
    // kembali ke kondisi terkunci dan buang isi dashboard dari layar
    unlocked = false; location.reload();
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (norm(input.value) === norm(PASSWORD)) unlock();
    else { err.classList.remove('hidden'); input.value = ''; input.focus(); }
  });
  // Tombol Back/Forward yang memulihkan halaman dari cache browser juga harus meminta password lagi
  window.addEventListener('pageshow', function (e) { if (e.persisted) lock(); });

  var h = (location.hash || '').replace('#', '');
  show(h === 'bpkb' ? 'bpkb' : 'piutang');
  input.focus();
})();
</script>
