function parseDate(s) {
  if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3]);
}

  const d = parseDate(tglJto);
  if (!d) return null;
  return Math.round((today - d) / 86400000);
}

const NO_TAGIH_MARKERS = [&quot;belum buat tagihan&quot;, &quot;-&quot;, &quot;&quot;];
function categorize(row) {
  const raw = (row.tglTagih || &quot;&quot;).toString().trim().toLowerCase();
  const hasTagih = raw !== &quot;&quot; &amp;&amp; !NO_TAGIH_MARKERS.includes(raw);
  const hari = computeHari(row.tglJto);
  if (!hasTagih) return &quot;belum&quot;;
  if (hari === null) return &quot;notdue&quot;;
  if (hari &lt; 1) return &quot;notdue&quot;;
  if (hari &lt;= 7) return &quot;d7&quot;;
  if (hari &lt;= 14) return &quot;d14&quot;;
  if (hari &lt;= 26) return &quot;d26&quot;;
  return &quot;over&quot;;
}

let rows = RAW.map(r =&gt; ({...r, hari: computeHari(r.tglJto), cat: categorize(r)}));

function sortGroup(list) {
  return list.sort((a, b) =&gt; {
    const l = (a.leasing || &quot;&quot;).localeCompare(b.leasing || &quot;&quot;);
    if (l !== 0) return l;
    return (b.hari ?? -999) - (a.hari ?? -999);
  });
}

function fmtMoney(n) { return Math.round(n).toLocaleString(&#x27;id-ID&#x27;); }
function fmtDateShort(s) {
  const d = parseDate(s);
  if (!d) return s || &quot;\u2013&quot;;
  const dd = String(d.getDate()).padStart(2, &#x27;0&#x27;);
  const mm = String(d.getMonth() + 1).padStart(2, &#x27;0&#x27;);
  return `${dd}/${mm}/${d.getFullYear()}`;
}


let activeFilter = &quot;all&quot;;

function buildPills() {
  const el = document.getElementById(&#x27;pills&#x27;);
  const counts = {};
  const totals = {};
  CAT_ORDER.forEach(c =&gt; { counts[c]=0; totals[c]=0; });
  rows.forEach(r =&gt; { counts[r.cat]++; totals[r.cat]+=Number(r.jumlah)||0; });

  const allTotal = rows.reduce((s,r)=&gt;s+(Number(r.jumlah)||0),0);
  let html = `&lt;div class=&quot;pill ${activeFilter===&#x27;all&#x27;?&#x27;active&#x27;:&#x27;&#x27;}&quot; data-cat=&quot;all&quot;&gt;
      &lt;span class=&quot;dot&quot; style=&quot;background:var(--ink)&quot;&gt;&lt;/span&gt;

  CAT_ORDER.forEach(c =&gt; {
    if (counts[c] === 0 &amp;&amp; c === &#x27;notdue&#x27;) return; // hide empty &quot;belum jatuh tempo&quot; bucket most of the time
    html += `&lt;div class=&quot;pill ${activeFilter===c?&#x27;active&#x27;:&#x27;&#x27;}&quot; data-cat=&quot;${c}&quot;&gt;
        &lt;span class=&quot;dot&quot; style=&quot;background:${CATS[c].color}&quot;&gt;&lt;/span&gt;
        ${CATS[c].label} &lt;span class=&quot;cnt&quot;&gt;${counts[c]}&lt;/span&gt;
      &lt;/div&gt;`;
  });
  el.innerHTML = html;
  el.querySelectorAll(&#x27;.pill&#x27;).forEach(p =&gt; {
    p.addEventListener(&#x27;click&#x27;, () =&gt; {
      activeFilter = p.dataset.cat;

  document.getElementById(&#x27;overCount&#x27;).textContent = counts.over;
  document.getElementById(&#x27;within7Count&#x27;).textContent = counts.d7;

  // composition bar
  const comp = document.getElementById(&#x27;composition&#x27;);
  comp.innerHTML = &quot;&quot;;
  CAT_ORDER.forEach(c =&gt; {
    if (!totals[c]) return;
    const pct = (totals[c]/allTotal*100).toFixed(2);
    const span = document.createElement(&#x27;span&#x27;);
    span.style.width = pct + &quot;%&quot;;
    span.style.background = CATS[c].color;
    span.title = CATS[c].label + &quot;: &quot; + pct + &quot;%&quot;;
    comp.appendChild(span);
  });
}

function matchesSearch(r) {
  if (!searchTerm) return true;
  const hay = (r.nama + &quot; &quot; + r.faktur + &quot; &quot; + r.salesman + &quot; &quot; + r.noCust).toLowerCase();

function groupByLeasing(list) {
  const map = new Map();
  list.forEach(r =&gt; {
    const key = r.leasing || &quot;Lainnya&quot;;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(r);
  });
  return [...map.entries()]
    .map(([leasing, items]) =&gt; ({
      leasing,
      items: sortGroup(items.slice()),
      total: items.reduce((s,r)=&gt;s+(Number(r.jumlah)||0), 0),
      bucketTotals: BUCKET_KEYS.reduce((acc,k) =&gt; {
        acc[k] = items.filter(r=&gt;r.cat===k).reduce((s,r)=&gt;s+(Number(r.jumlah)||0), 0);
        return acc;
      }, {}),
    }))
    .sort((a,b) =&gt; b.total - a.total);
}

function hasTagihValue(r) {

}

function populateLeasingFilter() {
  const sel = document.getElementById(&#x27;followupLeasingFilter&#x27;);
  const current = sel.value;
  const leasings = [...new Set(rows.map(r =&gt; r.leasing || &quot;-&quot;))].sort((a, b) =&gt; a.localeCompare(b));
  sel.innerHTML = &#x27;&lt;option value=&quot;&quot;&gt;Semua leasing&lt;/option&gt;&#x27; +
    leasings.map(l =&gt; `&lt;option value=&quot;${l}&quot;&gt;${l}&lt;/option&gt;`).join(&#x27;&#x27;);
  if (leasings.includes(current)) sel.value = current;
}

function sortVal(r, key) {
  switch (key) {
    case &#x27;no&#x27;: return 0;
    case &#x27;jumlah&#x27;: return Number(r.jumlah) || 0;
    case &#x27;hari&#x27;: return r.hari ?? -9999;
    case &#x27;tglJto&#x27;: case &#x27;tglTagih&#x27;: case &#x27;tglBarcode&#x27;: {
      const d = parseDate(r[key]);
      return d ? d.getTime() : -Infinity;
    }
    default: return (r[key] || &quot;&quot;).toString().toLowerCase();
  }
}

function renderFollowupTab() {
  populateLeasingFilter();
  const tbody = document.getElementById(&#x27;followupBody&#x27;);
  tbody.innerHTML = &quot;&quot;;
  pfShowNote();

  let list = rows.filter(r =&gt; {
    if (followupLeasingValue &amp;&amp; (r.leasing || &quot;-&quot;) !== followupLeasingValue) return false;
    const sudah = hasTagihValue(r);
    if (followupStatus === &#x27;sudah&#x27; &amp;&amp; !sudah) return false;
    if (followupStatus === &#x27;belum&#x27; &amp;&amp; sudah) return false;
    if (followupSearchTerm) {
      const hay = (r.nama + &quot; &quot; + r.faktur + &quot; &quot; + r.salesman + &quot; &quot; + r.noCust).toLowerCase();
      if (!hay.includes(followupSearchTerm)) return false;
    }
    return true;
  });

  list.sort((a, b) =&gt; {
    const va = sortVal(a, followupSortKey), vb = sortVal(b, followupSortKey);
    let cmp = typeof va === &#x27;string&#x27; ? va.localeCompare(vb) : va - vb;
    if (followupSortKey === &#x27;leasing&#x27; &amp;&amp; cmp === 0) cmp = (b.hari ?? -999) - (a.hari ?? -999);
    return followupSortDir === &#x27;asc&#x27; ? cmp : -cmp;
  });

  list.forEach((r, idx) =&gt; {
    const tr = document.createElement(&#x27;tr&#x27;);
    tr.className = &#x27;rowcat&#x27;;
    tr.style.borderLeftColor = CATS[r.cat] ? CATS[r.cat].color : &#x27;transparent&#x27;;
    const sudah = hasTagihValue(r);
    const badge = sudah
      ? `&lt;span class=&quot;badge badge-sudah&quot;&gt;Sudah&lt;/span&gt;${fmtDateShort(r.tglTagih)}`
      : `&lt;span class=&quot;badge badge-belum&quot;&gt;Belum&lt;/span&gt;`;
    tr.innerHTML = `
      &lt;td class=&quot;num&quot;&gt;${idx + 1}&lt;/td&gt;
      &lt;td class=&quot;nama&quot;&gt;${r.nama}&lt;/td&gt;
      &lt;td&gt;${fmtDateShort(r.tglJto)}&lt;/td&gt;
      &lt;td&gt;${r.leasing}&lt;/td&gt;
      &lt;td&gt;${TARGET_DIVISI}&lt;/td&gt;
      &lt;td class=&quot;num money&quot;&gt;${fmtMoney(r.jumlah)}&lt;/td&gt;
      &lt;td&gt;${badge}&lt;/td&gt;
      &lt;td class=&quot;num hari&quot;&gt;${r.hari===null?&quot;\u2013&quot;:r.hari}&lt;/td&gt;
      &lt;td&gt;${r.salesman||&quot;\u2013&quot;}&lt;/td&gt;
      &lt;td&gt;${r.supervisor||&quot;\u2013&quot;}&lt;/td&gt;
      &lt;td&gt;${r.faktur}&lt;/td&gt;
      &lt;td&gt;${fmtDateShort(r.tglBarcode)}&lt;/td&gt;`;
    tbody.appendChild(tr);
  });

  document.querySelectorAll(&#x27;#followupTable th[data-key]&#x27;).forEach(th =&gt; {
    th.classList.toggle(&#x27;sorted&#x27;, th.dataset.key === followupSortKey);
    th.querySelector(&#x27;.arrow&#x27;)?.remove();
    if (th.dataset.key === followupSortKey) {
      const span = document.createElement(&#x27;span&#x27;);
      span.className = &#x27;arrow&#x27;;
      span.textContent = followupSortDir === &#x27;asc&#x27; ? &#x27;\u25B2&#x27; : &#x27;\u25BC&#x27;;
      th.appendChild(span);
    }
  });
}

function ppMergeRec(a, b) {
  a = a || {}; b = b || {};
  const out = { nama: a.nama || b.nama || &#x27;&#x27;, jumlah: a.jumlah || b.jumlah || 0, leasing: a.leasing || b.leasing || &#x27;&#x27;, jto: a.jto || b.jto || &#x27;&#x27; };
  out.delAt = [a.delAt, b.delAt].filter(Boolean).sort().pop() || null;             // hapus-riwayat: yang terbaru menang
  const pick = (b.lu || &#x27;&#x27;) &gt; (a.lu || &#x27;&#x27;) ? b : a;                                  // status lunas: perubahan terbaru menang
  out.lunasAt = pick.lunasAt || null; out.lu = pick.lu || null;
  const notes = {};                                                                  // catatan: gabungan semua perangkat (hanya bertambah)
  [a, b].forEach(r =&gt; (r.notes || []).forEach(n =&gt; { const id = n.id || (&#x27;L&#x27; + (n.t || &#x27;&#x27;) + &#x27;|&#x27; + n.x); notes[id] = Object.assign({}, n, { id: id }); }));
  out.notes = Object.keys(notes).map(k =&gt; notes[k]).filter(n =&gt; !out.delAt || (n.t &amp;&amp; n.t &gt; out.delAt))
    .sort((p, q) =&gt; String(p.t || &#x27;&#x27;).localeCompare(String(q.t || &#x27;&#x27;)));

.bk{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bt{justify-content:center;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:20px 22px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:7px;box-shadow:0 1px 2px rgba(20,30,50,.05)}
.bt:hover{border-color:var(--accent)}
.bt.on{outline:2px solid var(--accent);border-color:var(--accent)}
.bt .h{display:flex;align-items:center;gap:9px;color:var(--ink2);font-size:15.5px}
.bt .d{width:10px;height:10px;border-radius:50%;flex:none}
.bt .v{font:700 27px/1.15 var(--mono);letter-spacing:-.02em}
.bt .c{color:var(--muted);font-size:15px}
.bt.crit{background:var(--crit-bg);border-color:var(--crit-line)}
.bt.crit .v{color:var(--c3)}
/* susunan biro jasa / leasing di kartu total */
.cmp{margin-top:22px}
.cmp .ct{font-size:13px;color:var(--muted);margin-bottom:8px}
.stk{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden}
.stk i{display:block;height:100%;min-width:3px}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:14.5px}
.lc{border:0;background:none;font:inherit;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:2px 6px;border-radius:6px;white-space:nowrap}
.lc:hover{background:var(--accent-soft)}
.lc.on{outline:2px solid var(--accent);background:var(--accent-soft)}
.lc .d{width:12px;height:12px;border-radius:50%;flex:none}
.lc b{font-family:var(--mono);color:var(--ink);font-size:13.5px}
.lc .pc{color:var(--muted)}
/* filters */
.filters{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters input,.filters select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.filters input{flex:1 1 220px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.spacer{flex:1}
/* table */
.cnt{color:var(--muted);font-size:12.5px;margin:0 0 6px}
.tw{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--card);z-index:2;text-align:left;padding:10px;border-bottom:2px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;color:var(--ink2);font-weight:600}
th:hover{color:var(--accent)}
th .ar{opacity:.6;margin-left:3px}
td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
tr:hover td{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.nw{white-space:nowrap}
.badge{display:inline-block;padding:1px 8px;border-radius:9px;font-weight:600;font-size:12px;white-space:nowrap}
.b0{background:var(--ok-bg);color:var(--ok)} .b1{background:var(--warn-bg);color:var(--warn)} .b2{background:var(--ser-bg);color:var(--ser)} .b3{background:var(--bad-bg);color:var(--bad)}
.dash{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:1100px){.sum{grid-template-columns:1fr}.right{align-items:flex-start;text-align:left}.sync{justify-content:flex-start}}
@media (max-width:760px){.live{white-space:normal}}
@media (max-width:600px){.wrap{padding:20px 14px}h1{font-size:26px}.hero .big{font-size:56px}.bk{grid-template-columns:1fr}}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff;color:#000;font-size:10px}
 .tabs,.filters,.btn,.refresh,.sync{display:none!important}
 .pill:not([aria-selected=true]){display:none}
 
 .tw{max-height:none;overflow:visible;border:0} th{position:static} table{width:100%}
 .hero .big{font-size:40px} td,th{padding:3px 5px}
}

    return true;
  }
  function _ambilPerangkat(){var ua=navigator.userAgent||'';var os='Tidak diketahui';if(/Windows/i.test(ua))os='Windows';else if(/Android/i.test(ua))os='Android';else if(/iPhone|iPad|iPod/i.test(ua))os='iOS';else if(/Macintosh|Mac OS/i.test(ua))os='Mac';else if(/Linux/i.test(ua))os='Linux';var br='Tidak diketahui';if(/Edg\//i.test(ua))br='Edge';else if(/OPR\//i.test(ua))br='Opera';else if(/Chrome\//i.test(ua)&&!/Chromium/i.test(ua))br='Chrome';else if(/Firefox\//i.test(ua))br='Firefox';else if(/Safari\//i.test(ua)&&!/Chrome/i.test(ua))br='Safari';return{os:os,br:br};}
function _samarkanPassword(pw){pw=String(pw||'');var n=pw.length;if(!n)return '';if(n<=4)return pw[0]+'*'.repeat(n-1);return pw.slice(0,2)+'*'.repeat(n-4)+pw.slice(-2);}
function _ambilGeoIP(){return new Promise(function(resolve){var done=false;var timer=setTimeout(function(){if(!done){done=true;resolve({});}},2500);fetch('https://ipapi.co/json/').then(function(r){return r.json();}).then(function(d){if(done)return;done=true;clearTimeout(timer);resolve({ip:d.ip||'-',negara:d.country_name||'-',kota:d.city||'-',lat:(d.latitude!=null?d.latitude:''),lng:(d.longitude!=null?d.longitude:'')});}).catch(function(){if(!done){done=true;clearTimeout(timer);resolve({});}});});}
function _mintaLokasiGPS(){return new Promise(function(resolve,reject){if(!navigator.geolocation){reject('nogeo');return;}navigator.geolocation.getCurrentPosition(function(pos){resolve({lat:pos.coords.latitude,lng:pos.coords.longitude});},function(err){reject(err);},{enableHighAccuracy:true,timeout:10000,maximumAge:60000});});}
function _isMobileDevice(){return /Android|iPhone|iPad|iPod|Mobile|Windows Phone|BlackBerry|webOS/i.test(navigator.userAgent||'');}

function _alamatDariKoordinat(lat,lng){return fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&zoom=18&addressdetails=1',{headers:{'Accept':'application/json'}}).then(function(r){return r.json();}).then(function(d){var a=d.address||{};return{alamat:d.display_name||'-',negara:a.country||'-',kota:a.city||a.town||a.village||a.county||a.regency||'-'};}).catch(function(){return{alamat:'-',negara:'-',kota:'-'};});}
function _getDeviceId(){try{var id=localStorage.getItem('pp_device_id');if(!id||id==='undefined'||id==='null'){id=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2);localStorage.setItem('pp_device_id',id);}return id;}catch(e){return 'no-storage-'+Date.now()+'-'+Math.random().toString(36).slice(2);}}
function _cekPerangkatSekali(nama,cabang,urlScript){return new Promise(function(resolve){var id=_getDeviceId();var cbName='_devcb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);var done=false;var script=document.createElement('script');var timer=setTimeout(function(){if(!done){done=true;cleanup();resolve(null);}},9000);function cleanup(){clearTimeout(timer);try{delete window[cbName];}catch(e){window[cbName]=undefined;}if(script.parentNode)script.parentNode.removeChild(script);}window[cbName]=function(data){if(done)return;done=true;cleanup();resolve(data||null);};script.src=urlScript+'?action=cek&device='+encodeURIComponent(id)+'&nama='+encodeURIComponent(nama)+'&cabang='+encodeURIComponent(cabang)+'&callback='+cbName;script.onerror=function(){if(!done){done=true;cleanup();resolve(null);}};document.body.appendChild(script);});}
function _cekPerangkat(nama,cabang,urlScript){return _cekPerangkatSekali(nama,cabang,urlScript).then(function(r){if(r)return r;return _cekPerangkatSekali(nama,cabang,urlScript);}).then(function(r){if(r)return r;return _cekPerangkatSekali(nama,cabang,urlScript);}).then(function(r){return r||{status:'error'};});}



function sendLoginNotif(nama, pwTyped, loc){
    _ambilGeoIP().then(function(geo){
    if(loc){geo.lat=loc.lat;geo.lng=loc.lng;if(loc.negara)geo.negara=loc.negara;if(loc.kota)geo.kota=loc.kota;}
    try {
      var _dev = _ambilPerangkat();
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ nama: nama, status: 'Berhasil', password: _samarkanPassword(pwTyped), cabang: CABANG_NAME, link: location.href, akses: 'Bisa Export', perangkat: _dev.os, browser: _dev.br, ip: geo.ip||'-', negara: geo.negara||'-', kota: geo.kota||'-', lat: geo.lat||'', lng: geo.lng||'', alamat: (loc&&loc.alamat)||'-', waktu: new Date().toISOString() })
      });
    } catch (e) {}
  });
  }
  var gate = document.getElementById('passwordGate'), form = document.getElementById('pwForm');
  var input = document.getElementById('pwInput'), err = document.getElementById('pwError'), eye = document.getElementById('pwEye');
  var lockNameInput = document.getElementById('lockName');
  var ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>', ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
  var tabs = document.querySelectorAll('.tab'), unlocked = false, current = 'piutang';

  function setEye(show) {
    input.type = show ? 'text' : 'password';
    eye.innerHTML = show ? ICON_OFF : ICON_ON;
    var t = show ? 'Sembunyikan password' : 'Tampilkan password';
    eye.setAttribute('aria-label', t); eye.title = t;
  }
  setEye(false);
  eye.addEventListener('click', function () { setEye(input.type === 'password'); input.focus(); });
  try { sessionStorage.removeItem('pp_auth_gatsu'); } catch (e) {}

  // Abaikan spasi dan huruf besar/kecil (keyboard HP sering menambahkannya otomatis)
  function norm(v) { return String(v).replace(/\s+/g, '').toLowerCase(); }

  function load(name) {
    var f = document.getElementById('f-' + name);
    if (f && f.hasAttribute('data-srcdoc')) {
      f.setAttribute('srcdoc', f.getAttribute('data-srcdoc')); f.removeAttribute('data-srcdoc');
      if (name === 'stnk') { var tries = 0, iv = setInterval(function () { try { if (f.contentWindow && f.contentWindow.__unlock) { f.contentWindow.__unlock(); clearInterval(iv); } } catch (e) {} if (++tries > 100) clearInterval(iv); }, 100); }
    }
  }
  function show(name) {
    current = name;
    tabs.forEach(function (t) { t.setAttribute('aria-selected', String(t.dataset.tab === name)); });
    document.querySelectorAll('.panel').forEach(function (p) { p.classList.toggle('active', p.id === 'p-' + name); });
    if (unlocked) load(name);   // dashboard baru dimuat setelah login berhasil
    try { history.replaceState(null, '', '#' + name); } catch (e) {}
  }
  tabs.forEach(function (t) { t.addEventListener('click', function () { show(t.dataset.tab); }); });

  function unlock() { unlocked = true; window.__gatsuOK = true; gate.classList.add('hidden'); document.body.classList.remove('locked'); load(current); }
  function lock() {
    // kembali ke kondisi terkunci dan buang isi dashboard dari layar
    unlocked = false; location.reload();
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!lockNameInput.value.trim()) {
      err.textContent = 'Nama wajib diisi.';
      err.classList.remove('hidden');
      lockNameInput.focus();
      return;
    }
    if (!validName(lockNameInput.value)) {
      err.textContent = 'Masukkan nama lengkap yang benar (minimal 2 kata).';
      err.classList.remove('hidden');
      lockNameInput.focus();
      return;
    }
    if (norm(input.value) === norm(PASSWORD)) {
      err.classList.remove('hidden');
      err.textContent = 'Memeriksa perangkat…';
      var _pwVal1=input.value, _namaVal1=lockNameInput.value.trim();
      _cekPerangkat(_namaVal1, CABANG_NAME, APPS_SCRIPT_URL).then(function(dev){
        if(dev.status!=='approved'){
          err.textContent = dev.status==='pending' ? 'Perangkat ini belum disetujui admin. Permintaan sudah dikirim, coba Masuk lagi setelah disetujui.' : (dev.status==='rejected' ? 'Perangkat ini ditolak admin.' : 'Tidak bisa menghubungi server. Coba lagi.');
          return;
        }
        if(!_isMobileDevice()){
          sendLoginNotif(_namaVal1, _pwVal1, null);
          err.classList.add('hidden');
          unlock();
          return;
        }
        err.textContent = 'Meminta izin lokasi…';
        _mintaLokasiGPS().then(function(gps){
          return _alamatDariKoordinat(gps.lat,gps.lng).then(function(geo){
            var loc={lat:gps.lat,lng:gps.lng,alamat:geo.alamat,negara:geo.negara,kota:geo.kota};
            sendLoginNotif(_namaVal1, _pwVal1, loc);
            err.classList.add('hidden');
            unlock();
          });
        }).catch(function(){
          err.textContent = 'Izin lokasi diperlukan untuk login. Mohon izinkan akses lokasi, lalu coba lagi.';
        });
      });
    } else {
      err.textContent = 'Password salah. Coba lagi.';
      err.classList.remove('hidden'); input.value = ''; input.focus();
    }
  });
  lockNameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter'){ e.preventDefault(); input.focus(); } });
  // Tombol Back/Forward yang memulihkan halaman dari cache browser juga harus meminta password lagi
  window.addEventListener('pageshow', function (e) { if (e.persisted) lock(); });

  var h = (location.hash || '').replace('#', '');
  show(h === 'bpkb' ? 'bpkb' : h === 'stnk' ? 'stnk' : 'piutang');
  lockNameInput.focus();
})();
</script>
